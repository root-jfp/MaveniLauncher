name: Build Maveni Launcher

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packager
        run: python -m pip install --upgrade pyinstaller

      - name: Build launcher
        run: pyinstaller --onefile --windowed --name MaveniLauncher launcher.py

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaveniLauncher-windows
          path: dist/MaveniLauncher.exe
